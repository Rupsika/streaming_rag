global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: xstream
    static_configs:
      - targets:
          - host.docker.internal:8001   # producer
          - host.docker.internal:8002   # signal
          - host.docker.internal:8003   # windowing
          - host.docker.internal:8004   # vlm/kg
          - host.docker.internal:8005   # rag
          - host.docker.internal:8006   # explain
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
